<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Architectures and Masks — Tier 8</title><style>:root{--bg:#fff;--fg:#1d2430;--mut:#667;--card:#f4f6fa;--ac:#4C78A8;--ac2:#F58518;--ac3:#54A24B;--hot:#E45756;--grid:#d8dde6}
@media(prefers-color-scheme:dark){:root{--bg:#14181f;--fg:#e6e9ef;--mut:#9aa3b2;--card:#1e242e;--grid:#343c4a}}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;max-width:1000px;margin:auto}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 6px}p.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:12px}
label{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap}label span.n{min-width:150px}
input[type=range]{flex:1;min-width:130px}b.v{min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
select,input[type=number],button{background:var(--bg);color:var(--fg);border:1px solid var(--grid);border-radius:6px;padding:4px 8px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--ac)}
canvas,svg.fig{width:100%;background:var(--bg);border-radius:8px;border:1px solid var(--grid);display:block}
.note{color:var(--mut);font-size:13px}.warn{color:var(--hot);font-size:13px}
table{border-collapse:collapse;font:13px ui-monospace,monospace;width:100%}td,th{padding:3px 8px;border-bottom:1px solid var(--grid);text-align:right}th:first-child,td:first-child{text-align:left}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:720px){.row{grid-template-columns:1fr}}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--ac);color:#fff;font-size:12px}
.bar{height:14px;border-radius:3px;display:inline-block;vertical-align:middle}
</style></head><body>
<h1>Encoder-only vs decoder-only vs encoder-decoder: attention masks and objectives</h1><p class="sub">See which positions each query can read in the three Transformer families, then compare the causal and masked training objectives.</p>

<div class="row"><div class="card">
<label><span class="n">architecture</span><select id="arch"><option value="enc">encoder-only (BERT-style)</option><option value="dec" selected>decoder-only (GPT-style)</option><option value="ed">encoder-decoder (T5/BART-style)</option></select></label>
<label><span class="n">source / input length</span><input id="S" type="range" min="3" max="14" value="8"><b class="v" id="Sv"></b></label>
<label><span class="n">target length (enc-dec)</span><input id="T" type="range" min="3" max="14" value="6"><b class="v" id="Tv"></b></label>
<label><span class="n">highlight query position</span><input id="q" type="range" min="1" max="14" value="4"><b class="v" id="qv"></b></label>
</div><div class="card"><h2>Training objective</h2>
<label><span class="n">objective</span><select id="obj"><option value="causal">causal LM (next-token)</option><option value="masked">masked LM (fill the blanks)</option></select></label>
<label><span class="n">mask rate</span><input id="mr" type="range" min="0.05" max="0.5" step="0.05" value="0.15"><b class="v" id="mrv"></b></label>
<button id="rs">re-sample masked positions</button>
<div id="objtxt" class="note"></div></div></div>
<div class="card"><canvas id="c" width="940" height="360"></canvas></div>
<div class="card" id="txt"></div>

<script>
const $=i=>document.getElementById(i);const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let seed=3;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
let maskSet=null;
function grid(g,x0,y0,n,m,cell,vis,title,q,rowLab,colLab){ // rows=queries n, cols=keys m
 g.fillStyle=cv("--fg");g.font="bold 13px sans-serif";g.fillText(title,x0,y0-22);g.font="11px sans-serif";g.fillStyle=cv("--mut");g.fillText("rows = queries ("+rowLab+"), columns = keys ("+colLab+")",x0,y0-8);
 for(let i=0;i<n;i++)for(let j=0;j<m;j++){const v=vis(i,j);g.fillStyle=v?cv("--ac"):cv("--grid");g.globalAlpha=v?(i==q?1:0.55):0.35;g.fillRect(x0+j*cell,y0+i*cell,cell-1.5,cell-1.5);g.globalAlpha=1}
 if(q>=0&&q<n){g.strokeStyle=cv("--hot");g.lineWidth=2.5;g.strokeRect(x0-1,y0+q*cell-1,m*cell,cell+0.5)}}
function run(){const arch=$("arch").value,S=+$("S").value,T=+$("T").value,obj=$("obj").value,mr=+$("mr").value;
 $("q").max=Math.max(S,arch=="ed"?T:S);const qq=Math.min(+$("q").value,arch=="ed"?T:S)-1;["S","T","q","mr"].forEach(k=>$(k+"v").textContent=$(k).value);
 const c=$("c"),g=c.getContext("2d");g.clearRect(0,0,c.width,c.height);const cell=Math.min(20,Math.floor(270/Math.max(S,T)));
 let info="";
 if(arch=="enc"){grid(g,40,50,S,S,cell*1.3,()=>true,"Encoder self-attention: FULL",qq,"token i","token j");info="Every token sees every token (left and right). Good for understanding / classification / embeddings; cannot generate token-by-token because position i would see the answer at i+1."}
 else if(arch=="dec"){grid(g,40,50,S,S,cell*1.3,(i,j)=>j<=i,"Decoder self-attention: CAUSAL",qq,"token i","token j");info="Row i can read columns 0..i only (lower triangle). The query at position "+(qq+1)+" sees "+(qq+1)+" of "+S+" tokens. This is what lets one forward pass train all "+S+" next-token predictions in parallel."}
 else{grid(g,20,50,S,S,cell,()=>true,"Encoder self-attn: FULL",-1,"source i","source j");
  grid(g,20+S*cell+50,50,T,T,cell,(i,j)=>j<=i,"Decoder self-attn: CAUSAL",qq,"target i","target j");
  grid(g,20+S*cell+T*cell+100,50,T,S,cell,()=>true,"Cross-attention: FULL",qq,"target i","source j");
  info="Encoder reads the whole source bidirectionally. The decoder is causal over its own tokens, and each decoder position also attends to <em>all</em> encoder outputs through cross-attention (queries from the decoder, keys/values from the encoder)."}
 $("txt").innerHTML="<b>Reading the picture.</b> "+info;
 // objective strip
 const toks=["The","cat","sat","on","the","mat","and","purred","loudly","all","night","long","today","."].slice(0,S);
 if(!maskSet||maskSet.n!==S||maskSet.r!==mr){maskSet={n:S,r:mr,s:toks.map(()=>rnd()<mr)};if(!maskSet.s.some(v=>v))maskSet.s[Math.floor(rnd()*S)]=true}
 const ys=Math.round(c.height-60);g.font="13px monospace";let x=40;
 toks.forEach((t,i)=>{const m=obj=="masked"&&maskSet.s[i];const lab=m?"[MASK]":t,w=g.measureText(lab).width+14;
  const lossHere=obj=="causal"?i<S-1:m;g.fillStyle=m?cv("--hot"):(lossHere?cv("--ac3"):cv("--grid"));g.fillRect(x,ys,w-4,24);
  g.fillStyle=lossHere||m?"#fff":cv("--fg");g.fillText(lab,x+5,ys+16);g.fillStyle=cv("--mut");g.font="10px sans-serif";
  g.fillText(lossHere?(obj=="causal"?"→ "+toks[i+1]:"→ "+t):"no loss",x,ys+38);g.font="13px monospace";x+=w+2});
 const nl=obj=="causal"?S-1:maskSet.s.filter(v=>v).length;
 $("objtxt").innerHTML=obj=="causal"?"Causal LM: with a causal mask, <b>"+nl+" of "+S+"</b> positions give a training signal in one pass (every position predicts its successor).":"Masked LM: only the <b>"+nl+" masked</b> positions ("+(100*nl/S).toFixed(0)+"%) carry loss, so each pass teaches less per token than causal LM — one reason decoder-only pretraining is sample-efficient (exact comparisons are model/data dependent; REVIEW_REQUIRED)."}
["arch","S","T","q","obj","mr"].forEach(i=>$(i).addEventListener("input",run));$("rs").onclick=()=>{maskSet=null;run()};run();matchMedia("(prefers-color-scheme: dark)").addEventListener("change",run);

</script></body></html>
