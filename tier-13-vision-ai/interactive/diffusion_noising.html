<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diffusion Noising Explorer - Tier 13</title><style>:root{--bg:#fff;--fg:#1d2430;--mut:#667;--card:#f4f6fa;--ac:#4C78A8;--ac2:#F58518;--hot:#E45756;--grid:#d8dde6}@media(prefers-color-scheme:dark){:root{--bg:#14181f;--fg:#e6e9ef;--mut:#9aa3b2;--card:#1e242e;--grid:#343c4a}}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;max-width:980px;margin:auto}h1{font-size:20px;margin:0 0 4px}p.sub{color:var(--mut);margin:0 0 14px}.card{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:12px}label{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap}label span.n{min-width:150px}input[type=range]{flex:1;min-width:140px}b.v{min-width:56px;text-align:right;font-variant-numeric:tabular-nums}select,button,input[type=number]{background:var(--bg);color:var(--fg);border:1px solid var(--grid);border-radius:6px;padding:4px 8px;font:inherit}button{cursor:pointer}canvas{background:var(--bg);border-radius:8px;border:1px solid var(--grid);max-width:100%}.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}.row>div{flex:1;min-width:240px}.note{color:var(--mut);font-size:13px}table{border-collapse:collapse;font:13px monospace}td,th{padding:2px 8px;border-bottom:1px solid var(--grid);text-align:left}code{font-family:monospace}.k input{width:54px;text-align:center}</style></head><body>
<h1>Diffusion forward-noising explorer</h1><p class="sub">Slide timestep and noise schedule; see signal fade into noise. Tier 13.30.</p>
<div class="card"><label><span class="n">timestep t</span><input id="t" type="range" min="0" max="200" value="0"><b class="v" id="tv"></b></label>
<label><span class="n">T (total steps)</span><input id="T" type="range" min="50" max="1000" step="50" value="200"><b class="v" id="Tv"></b></label>
<label><span class="n">schedule</span><select id="sch"><option>linear</option><option>cosine</option></select></label>
<label><span class="n">beta_end (linear)</span><input id="be" type="range" min="0.005" max="0.1" step="0.005" value="0.04"><b class="v" id="bev"></b></label>
<button id="pl">play</button><table id="tb"></table></div>
<div class="row"><div class="card"><canvas id="c" width="300" height="300"></canvas><p class="note">x<sub>t</sub> = &radic;&#x0101;<sub>t</sub>&middot;x<sub>0</sub> + &radic;(1&minus;&#x0101;<sub>t</sub>)&middot;&epsilon; (fixed &epsilon;)</p></div>
<div class="card"><canvas id="c2" width="320" height="300"></canvas><p class="note">signal weight &radic;&#x0101;<sub>t</sub> (blue) and noise weight (red) over t</p></div></div>
<script>
const $=i=>document.getElementById(i);
function cs(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const n=32,x0=[],eps=[];{const r=mulberry(7),gs=()=>{let u=0;for(let i=0;i<6;i++)u+=r();return(u-3)*1.41};for(let y=0;y<n;y++)for(let x=0;x<n;x++){const d=(y-14)**2+(x-13)**2<80,sq=Math.abs(y-22)<6&&Math.abs(x-22)<6;x0.push(d?[.9,.25,.25]:sq?[.25,.45,.9]:[.92,.93,.96]);eps.push([gs(),gs(),gs()])}}
function ab(T,sch,be){const a=[];let p=1;for(let t=0;t<T;t++){let al;if(sch=="linear"){const b=1e-4+(be-1e-4)*t/(T-1);p*=1-b;al=p}else{const f=s=>Math.cos((s/T+.008)/1.008*Math.PI/2)**2;al=f(t+1)/f(0)}a.push(Math.min(.99999,Math.max(1e-6,al)))}return a}
let timer=null;
function run(){const T=+$("T").value;$("t").max=T-1;if(+$("t").value>T-1)$("t").value=T-1;const t=+$("t").value,be=+$("be").value;$("tv").textContent=t;$("Tv").textContent=T;$("bev").textContent=be;
 const a=ab(T,$("sch").value,be),s=Math.sqrt(a[t]),ns=Math.sqrt(1-a[t]);
 const c=$("c"),g=c.getContext("2d"),q=300/n;for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=y*n+x,col=[0,1,2].map(k=>Math.round(255*Math.max(0,Math.min(1,(s*(x0[i][k]*2-1)+ns*eps[i][k]+1)/2))));g.fillStyle="rgb("+col+")";g.fillRect(x*q,y*q,q+1,q+1)}
 const c2=$("c2"),h=c2.getContext("2d");h.clearRect(0,0,320,300);const pl=(f,col)=>{h.strokeStyle=col;h.lineWidth=2.5;h.beginPath();a.forEach((v,i)=>{const X=20+i/(T-1)*280,Y=280-f(v)*260;i?h.lineTo(X,Y):h.moveTo(X,Y)});h.stroke()};pl(v=>Math.sqrt(v),"#4C78A8");pl(v=>Math.sqrt(1-v),"#E45756");
 h.strokeStyle=cs("--mut");h.setLineDash([4,4]);h.beginPath();h.moveTo(20+t/(T-1)*280,10);h.lineTo(20+t/(T-1)*280,280);h.stroke();h.setLineDash([]);h.fillStyle=cs("--mut");h.font="12px sans-serif";h.fillText("t →",280,296);
 $("tb").innerHTML="<tr><th>abar_t</th><td>"+a[t].toFixed(4)+"</td></tr><tr><th>signal / noise weight</th><td>"+s.toFixed(3)+" / "+ns.toFixed(3)+"</td></tr><tr><th>SNR = abar/(1-abar)</th><td>"+(a[t]/(1-a[t])).toExponential(2)+"</td></tr><tr><th>abar at last step</th><td>"+a[T-1].toExponential(2)+" (should be ~0: pure noise)</td></tr>"}
$("pl").onclick=()=>{if(timer){clearInterval(timer);timer=null;$("pl").textContent="play";return}$("pl").textContent="pause";timer=setInterval(()=>{const T=+$("T").value;$("t").value=(+$("t").value+Math.ceil(T/100))%T;run()},60)};
["t","T","sch","be"].forEach(i=>$(i).addEventListener("input",run));run();
</script></body></html>
