<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Special Tokens &amp; Padding — Tier 6</title><style>:root{--bg:#fff;--fg:#1d2430;--mut:#667;--card:#f4f6fa;--ac:#4C78A8;--ac2:#F58518;--hot:#E45756;--grid:#d8dde6;--pad:#999;--bos:#54A24B}@media(prefers-color-scheme:dark){:root{--bg:#14181f;--fg:#e6e9ef;--mut:#9aa3b2;--card:#1e242e;--grid:#343c4a}}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;max-width:980px;margin:auto}h1{font-size:20px;margin:0 0 4px}p.sub{color:var(--mut);margin:0 0 14px}.card{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:12px;overflow-x:auto}label{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap}label span.n{min-width:170px}input[type=range]{flex:1;min-width:140px}b.v{min-width:40px;text-align:right}textarea{width:100%;min-height:80px;background:var(--bg);color:var(--fg);border:1px solid var(--grid);border-radius:6px;padding:6px;font:13px monospace}.row{white-space:nowrap;margin:3px 0}.t{display:inline-block;width:64px;text-align:center;padding:3px 0;margin-right:3px;border-radius:5px;color:#fff;font:12px monospace;background:var(--ac)}.t.bos{background:var(--bos)}.t.eos{background:var(--hot)}.t.pad{background:var(--pad)}.m{display:inline-block;width:64px;text-align:center;margin-right:3px;font:12px monospace}.note{color:var(--mut);font-size:13px}select{background:var(--bg);color:var(--fg);border:1px solid var(--grid);border-radius:6px;padding:3px}</style></head><body>
<h1>Special tokens, padding &amp; masks</h1><p class="sub">One sentence per line (whitespace-split words stand in for tokens). Add BOS/EOS, pad to a rectangle, and see the attention mask and wasted compute.</p>
<div class="card"><textarea id="t">The cat sat
Hello world how are you today
Hi</textarea>
<label><span class="n">add &lt;BOS&gt;</span><input id="b" type="checkbox" checked></label>
<label><span class="n">add &lt;EOS&gt;</span><input id="e" type="checkbox" checked></label>
<label><span class="n">padding side</span><select id="s"><option value="r">right (training default)</option><option value="l">left (batched generation)</option></select></label>
<label><span class="n">cap length (truncate)</span><input id="c" type="range" min="2" max="20" value="20"><b class="v" id="cv"></b></label></div>
<div class="card"><div id="out"></div></div><div class="card" id="st"></div>
<script>
const $=i=>document.getElementById(i);
function run(){const cap=+$("c").value;$("cv").textContent=cap;
 let seqs=$("t").value.split("\n").map(l=>l.trim().split(/\s+/).filter(Boolean)).filter(a=>a.length);
 seqs=seqs.map(a=>{let x=a.slice(0,Math.max(1,cap-($("b").checked?1:0)-($("e").checked?1:0)));if($("b").checked)x=["<BOS>",...x];if($("e").checked)x=[...x,"<EOS>"];return x});
 const L=Math.max(1,...seqs.map(a=>a.length)),left=$("s").value=="l";let real=0,html="";
 seqs.forEach(a=>{real+=a.length;const pad=Array(L-a.length).fill("<PAD>");const row=left?[...pad,...a]:[...a,...pad];
  html+="<div class='row'>"+row.map(t=>"<span class='t "+(t=="<BOS>"?"bos":t=="<EOS>"?"eos":t=="<PAD>"?"pad":"")+"'>"+t.replace("<","&lt;")+"</span>").join("")+"</div>";
  html+="<div class='row'>"+row.map(t=>"<span class='m'>"+(t=="<PAD>"?"0":"1")+"</span>").join("")+"  ← attention mask</div>"});
 $("out").innerHTML=html;const tot=L*seqs.length;
 $("st").innerHTML="batch shape: <b>"+seqs.length+" × "+L+"</b> = "+tot+" slots; real tokens "+real+"; padding "+(tot-real)+" (<b>"+(100*(tot-real)/tot).toFixed(0)+"% wasted</b>). Tip: sort/bucket by length to reduce waste. Without the mask, PAD slots would be attended to.";}
["t","b","e","s","c"].forEach(i=>$(i).addEventListener("input",run));run();
</script></body></html>
