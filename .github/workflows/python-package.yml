name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8
        # CPU-only PyTorch first (small download); the tier files then see it as already satisfied
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        for f in tier-0*/requirements.txt; do python -m pip install -r "$f"; done
    - name: Lint with flake8
      run: |
        # stop the build on syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Test with pytest
      env:
        MPLBACKEND: Agg
      run: |
        python -m pytest -q
